# Local IPv4 address to listen on. Use 0.0.0.0 to listen on all IPv4 interfaces.
bind = 127.0.0.1
port = 8080

# Set to true to have the plugin set sv_downloadurl when the HTTP server is ready.
auto_set_downloadurl = false

# IPv4 address or hostname advertised to players in automatic mode. Leave blank to use bind.
# If bind = 0.0.0.0 in automatic mode, set public_host to a reachable address such as downloads.example.com.
public_host =

# TCP port advertised in automatic mode. Set to 0 to use the listening port.
public_port = 0

# Number of worker threads that open and read files (1 to 32).
workers = 16

# Maximum number of active HTTP connections (1 to 256). Additional connections wait in the TCP backlog.
max_connections = 32

# How long a cached copy stays fresh, in seconds (0 to 86400). Set to 0 to require revalidation with the ETag before reuse.
cache_seconds = 300

# File extensions served from the game directory root and from maps, models, sound, sprites, overviews and gfx/env.
# Separate extensions with commas. Leave the list empty to disable downloads. A file such as map.bsp.bz2 uses the .bsp rule.
extensions_files = .bsp, .res, .wad, .mdl, .wav, .mp3, .spr, .txt, .tga, .bmp
